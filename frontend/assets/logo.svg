<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background space glow -->
    <radialGradient id="spaceGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#020617" stop-opacity="1"/>
    </radialGradient>

    <!-- SPHEREx Hexagonal Shield Gradient -->
    <linearGradient id="hexShield" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b"/>
      <stop offset="50%" stop-color="#ea580c"/>
      <stop offset="100%" stop-color="#dc2626"/>
    </linearGradient>

    <!-- 102-Band Infrared Dispersion Gradient -->
    <linearGradient id="irDispersion" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1"/>    <!-- 0.75 um Optical/NIR -->
      <stop offset="25%" stop-color="#06b6d4"/>   <!-- 1.25 um J-Band -->
      <stop offset="50%" stop-color="#10b981"/>   <!-- 2.20 um K-Band -->
      <stop offset="75%" stop-color="#f59e0b"/>   <!-- 3.30 um Methane CH4 -->
      <stop offset="100%" stop-color="#ef4444"/>  <!-- 5.00 um Planet X / Thermal -->
    </linearGradient>

    <!-- Planet X / Cold Brown Dwarf Thermal Core -->
    <radialGradient id="coreGlow" cx="45%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="40%" stop-color="#f97316"/>
      <stop offset="85%" stop-color="#991b1b"/>
      <stop offset="100%" stop-color="#450a0a"/>
    </radialGradient>
  </defs>

  <!-- Hexagonal Cryocooler Sunshield Frame -->
  <polygon points="50,4 90,26 90,74 50,96 10,74 10,26" 
           fill="url(#spaceGlow)" 
           stroke="url(#hexShield)" 
           stroke-width="2.5" 
           stroke-linejoin="round" />

  <!-- Inner Hexagonal Aperture Accent -->
  <polygon points="50,12 82,30 82,70 50,88 18,70 18,30" 
           fill="none" 
           stroke="#334155" 
           stroke-width="1" 
           stroke-dasharray="3,2" />

  <!-- Multi-Band Spectral Prism Dispersion Arcs -->
  <circle cx="50" cy="50" r="30" fill="none" stroke="url(#irDispersion)" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="140 50" transform="rotate(-45 50 50)" />
  <circle cx="50" cy="50" r="23" fill="none" stroke="#38bdf8" stroke-width="1.2" stroke-opacity="0.6" stroke-dasharray="80 60" transform="rotate(45 50 50)" />

  <!-- Inclined Planet X Orbit Ellipse -->
  <ellipse cx="50" cy="50" rx="34" ry="14" fill="none" stroke="#f59e0b" stroke-width="1.2" stroke-opacity="0.7" transform="rotate(-25 50 50)" />

  <!-- Astrometric Reticle Crosshairs (Multi-Epoch Dipole Target) -->
  <line x1="50" y1="26" x2="50" y2="42" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="50" y1="58" x2="50" y2="74" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="26" y1="50" x2="42" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />
  <line x1="58" y1="50" x2="74" y2="50" stroke="#38bdf8" stroke-width="1.5" stroke-linecap="round" />

  <!-- Reticle Corner Ticks -->
  <circle cx="50" cy="50" r="14" fill="none" stroke="#38bdf8" stroke-width="1" stroke-dasharray="4,4" />

  <!-- Planet X Thermal Core -->
  <circle cx="50" cy="50" r="7.5" fill="url(#coreGlow)" />
  <!-- Moving Companion / Proper Motion Dipole Dot -->
  <circle cx="64" cy="43" r="3" fill="#38bdf8" />
  <line x1="54" y1="48" x2="62" y2="44" stroke="#38bdf8" stroke-width="1" stroke-dasharray="1,1" />
</svg>
